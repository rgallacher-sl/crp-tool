                      - heading "Refreshing issues" [level=3] [ref=e397]
                    - paragraph [ref=e398]: Sometimes refreshing can take longer than expected or fail for some resources due to, for example, availability zone outages. When refreshing can’t be completed within 1-10 seconds, communicate that the process is taking longer by using a status indicator next to the refresh button.
                    - list [ref=e399]:
                      - listitem [ref=e400]:
                        - paragraph [ref=e401]:
                          - text: If the API call returns issues with the refreshing, use a
                          - link "pending status indicator" [ref=e402]:
                            - /url: /components/status-indicator/?tabId=playground&example=pending
                          - text: to inform users. Include in the popover additional information to explain the issues, such as longer time required to perform the refresh.
                      - listitem [ref=e403]:
                        - paragraph [ref=e404]:
                          - text: If the API call returns partial or total failure of the refreshing, use a
                          - link "warning status indicator" [ref=e405]:
                            - /url: /components/status-indicator/?tabId=playground&example=warning
                          - text: to inform users. Include in the popover additional information to explain the failure and provide actions to support users, such as retry or filter out affected availability zones.
                    - group "Component composition demo" [ref=e408]
