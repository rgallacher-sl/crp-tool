                      - heading "Loading and refreshing" [level=3] [ref=e345]
                    - paragraph [ref=e346]: Loading is the process of bringing data or content into an application or a web page. For example, loading at first page visit to make information available to users. Refreshing is the action of updating or reloading the current state of a system or application. It can be done manually by a user or automatically by the system, to ensure that the displayed information is current and up-to-date.
                    - generic [ref=e347]:
                      - button "Copy link to Refresh types section" [ref=e352] [cursor=pointer]:
                        - generic [ref=e353]:
                          - img
                      - heading "Refresh types" [level=3] [ref=e354]
                    - paragraph [ref=e355]:
                      - text: Refresh can be applied in scenarios when data is fetched from the backend, such as in a
                      - link "collection view" [ref=e356]:
                        - /url: /patterns/resource-management/view/
                      - text: ", within a data list."
                    - list [ref=e357]:
                      - listitem [ref=e358]:
                        - paragraph [ref=e359]:
                          - text: Manual refresh is triggered by user interaction, via a
                          - link "button" [ref=e360]:
                            - /url: /components/button/?tabId=playground&example=normal-button
                          - text: ", ensuring control over when the data is updated. For example, a"
                          - link "table" [ref=e361]:
                            - /url: /components/table/
                          - text: with a large data set where users need to perform actions on several resources.
                      - listitem [ref=e362]:
                        - paragraph [ref=e363]:
                          - text: Automatic refresh is achieved by refreshing the data set at predefined intervals, for example 10 seconds, offering real-time updates and continuous synchronization with the dataset. For example, a
                          - link "select" [ref=e364]:
                            - /url: /components/select/
                          - text: where the list represents resources created across consoles.
                    - paragraph [ref=e365]: Choose the best refresh type depending on your use-case, user needs, and API type.
                  - generic [ref=e367]:
                    - generic [ref=e368]:
                      - button "Copy link to Manual refresh section" [ref=e373] [cursor=pointer]:
                        - generic [ref=e374]:
