                      - heading "Successful refresh" [level=3] [ref=e383]
                    - paragraph [ref=e384]:
                      - text: You can include a refresh button as part of the
                      - link "header" [ref=e385]:
                        - /url: /components/header/
                      - text: ", for example in a"
                      - link "table" [ref=e386]:
                        - /url: /components/table/
                      - text: . Keep the dataset visible while the refresh operation is ongoing, and enable users to perform actions on the resources. Once the data set is refreshed, display a timestamp to provide users with information on the outcome of the operation.
                    - group "Component composition demo" [ref=e389]
                    - generic [ref=e390]:
                      - button "Copy link to Refreshing issues section" [ref=e395] [cursor=pointer]:
