          - generic [ref=e105]:
            - paragraph [ref=e106]: Netlify’s AI capabilities help diagnose and suggest solutions for deploy failures or build errors so you can get back to shipping code.
            - paragraph [ref=e107]:
              - img "A failed deploy with a \"Why did it fail?\" button and a diagnosis and suggested solution above the deploy log details" [ref=e108]
            - generic [ref=e109]:
              - heading "How these solution suggestions work" [level=3] [ref=e110]
              - link "Section titled “How these solution suggestions work”" [ref=e111] [cursor=pointer]:
                - /url: "#how-these-solution-suggestions-work"
                - img [ref=e113]
                - generic [ref=e115]: Section titled “How these solution suggestions work”
            - paragraph [ref=e116]:
              - text: When a deployment failure happens, your team will find a
              - strong [ref=e117]: Why did it fail?
              - text: button on the failed deploy summary page. This button always appears on failed deploys unless an Owner has disabled the feature for your team.
            - paragraph [ref=e118]:
              - text: If this feature is enabled for your team and you select the
              - strong [ref=e119]: Why did it fail?
              - text: button, the details about the failure are processed by Netlify’s AI systems to generate guidance for how to resolve the issue.
            - paragraph [ref=e120]: We’re continuously improving the feature to suggest accurate solutions but your team should review them for accuracy.
            - generic [ref=e121]:
              - heading "Security for solution suggestions" [level=4] [ref=e122]
              - link "Section titled “Security for solution suggestions”" [ref=e123] [cursor=pointer]:
                - /url: "#security-for-solution-suggestions"
                - img [ref=e125]
                - generic [ref=e127]: Section titled “Security for solution suggestions”
            - paragraph [ref=e128]: This feature does not use the information processed to train models or store data outside of Netlify’s systems.
            - paragraph [ref=e129]: "The deploy failure details used to generate suggestions includes:"
            - list [ref=e130]:
              - listitem [ref=e131]: a subsection of the build log entries in your deploy log at or around the place where the error returns.
              - listitem [ref=e132]: other metadata, such as the name of your site’s framework to provide more accurate results.
            - paragraph [ref=e133]:
              - text: Like all Netlify features, usage of this capability is subject to our service agreements referenced in the
              - link "Terms of Use" [ref=e134] [cursor=pointer]:
                - /url: https://www.netlify.com/legal/terms-of-use/
              - text: .
            - generic [ref=e135]:
              - heading "Enable solution suggestions" [level=3] [ref=e136]
              - link "Section titled “Enable solution suggestions”" [ref=e137] [cursor=pointer]:
                - /url: "#enable-solution-suggestions"
                - img [ref=e139]
                - generic [ref=e141]: Section titled “Enable solution suggestions”
            - paragraph [ref=e142]: These AI capabilities are only available if they have been enabled for your team. Once enabled, any Developer or Owner on your team can use this AI capability to generate solutions for resolving deploy failures on all sites they have access to in your team.
            - paragraph [ref=e143]: "Who can turn this feature on or off:"
            - list [ref=e144]:
              - listitem [ref=e145]: Owners can enable or disable this feature for their team.
              - listitem [ref=e146]:
                - text: Developers can enable this feature for their team unless an Owner has disabled this feature for the team. The
                - strong [ref=e147]: Why did it fail?
                - text: button appears to Developers and Owners unless the feature is disabled.
                - list [ref=e148]:
                  - listitem [ref=e149]:
                    - text: If a Developer selects the
                    - strong [ref=e150]: Why did it fail?
                    - text: button and the feature is not enabled or disabled for the team, then a prompt appears to enable this feature for the team. Until this feature is enabled on the team, selecting this button will not process the deploy failure details or generate suggestions.
            - paragraph [ref=e151]: "As an Owner, to enable deploy failure solution suggestions:"
            - list [ref=e152]:
              - listitem [ref=e153]:
                - text: For your team, go to
                - generic "Navigation path" [ref=e154]:
                  - strong [ref=e155]: Team settings > General > AI enablement
              - listitem [ref=e156]:
                - text: Select
                - strong [ref=e157]: Configure
                - text: .
              - listitem [ref=e158]:
                - text: Choose
                - strong [ref=e159]: Enabled
                - text: .
