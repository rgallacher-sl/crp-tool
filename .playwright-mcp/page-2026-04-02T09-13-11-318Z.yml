                  - paragraph [ref=e553]: Sometimes, an app that runs fine locally might fail to deploy to Render at first. When this happens, it's almost always because of differences between your local development environment and the environment that Render uses to build and run your code.
                  - paragraph [ref=e554]: "These environmental differences might include:"
                  - list [ref=e555]:
                    - listitem [ref=e556]:
                      - text: The
                      - link "version of your programming language" [ref=e557] [cursor=pointer]:
                        - /url: /docs/language-support
                    - listitem [ref=e558]:
                      - text: The values of important
                      - button "Show definition for environment variable" [ref=e559]: environment variables
                    - listitem [ref=e560]:
                      - text: The availability of particular
                      - link "tools and utilities" [ref=e561] [cursor=pointer]:
                        - /url: /docs/native-runtimes#tools-and-utilities
                    - listitem [ref=e562]: The versions of your project's dependencies
                  - paragraph [ref=e563]: For recommended steps to resolve issues with your app's Render deploy, see below.
                  - heading "1. Check the logs" [level=2] [ref=e564]:
                    - link [ref=e565] [cursor=pointer]:
                      - /url: "#1-check-the-logs"
                      - img [ref=e566]
                    - text: 1. Check the logs
                  - paragraph [ref=e568]:
                    - text: Whenever your app misbehaves in any way,
                    - strong [ref=e569]: always check the logs first.
                    - text: Logs are available in the
                    - link "Render Dashboard" [ref=e570] [cursor=pointer]:
                      - /url: https://dashboard.render.com
                    - text: ":"
                  - list [ref=e571]:
                    - listitem [ref=e572]:
                      - paragraph [ref=e573]:
                        - text: If a particular deploy fails, view its logs by clicking the word
                        - strong [ref=e574]: Deploy
                        - text: in your app's
                        - strong [ref=e575]: Events
                        - text: "feed:"
                      - paragraph [ref=e577]:
                        - img "Selecting a deploy to view logs" [ref=e579]
                    - listitem [ref=e580]:
                      - paragraph [ref=e581]:
                        - text: If your running app encounters an error, open its
                        - strong [ref=e582]: Logs
                        - text: "page to search and filter runtime logs with the explorer:"
                      - paragraph [ref=e584]:
                        - img "Log explorer in the Render Dashboard" [ref=e586]
                  - paragraph [ref=e587]:
                    - text: In either case, searching the log explorer for the word
                    - code [ref=e588]: error
                    - text: can often direct you to a relevant log line. If the meaning of the full error message is unclear, try searching the web (or an individual site like Stack Overflow or
                    - link "Discord" [ref=e589] [cursor=pointer]:
                      - /url: https://discord.gg/kt5namUTqb
                    - text: ) to help identify a root cause.
                  - paragraph [ref=e590]:
                    - link "Learn more about logging." [ref=e591] [cursor=pointer]:
                      - /url: /docs/logging
                  - heading "2. Ensure matching versions and configuration" [level=2] [ref=e592]:
                    - link [ref=e593] [cursor=pointer]:
                      - /url: "#2-ensure-matching-versions-and-configuration"
                      - img [ref=e594]
                    - text: 2. Ensure matching versions and configuration
                  - paragraph [ref=e596]:
                    - text: Render's runtime environment might use a different version of your app's programming language, or of an installed dependency. The values of certain
                    - button "Show definition for environment variable" [ref=e597]: environment variables
                    - text: might also differ from those on your local machine.
                  - paragraph [ref=e598]: "Check your app's configuration for the following:"
                  - paragraph [ref=e599]:
                    - strong [ref=e600]: Runtime mismatches
                  - list [ref=e601]:
                    - listitem [ref=e602]:
                      - text: While creating a service, you select the
                      - link "runtime" [ref=e603] [cursor=pointer]:
                        - /url: /docs/language-support
                      - text: that corresponds to your language (Node, Python, and so on). There's also a Docker runtime for projects that build from a Dockerfile or pull a prebuilt image.
                    - listitem [ref=e604]:
                      - text: If you've selected an incorrect runtime for your app, the fastest fix is usually to create a
                      - emphasis [ref=e605]: new
                      - text: service with the correct runtime.
                      - list [ref=e606]:
                        - listitem [ref=e607]:
                          - text: You can also change an existing service's runtime via Render Blueprints or the API.
                          - link "See details." [ref=e608] [cursor=pointer]:
                            - /url: /docs/native-runtimes#changing-a-services-runtime
                  - paragraph [ref=e609]:
                    - strong [ref=e610]: Version mismatches
                  - list [ref=e611]:
                    - listitem [ref=e612]:
                      - text: Each programming language has a
                      - emphasis [ref=e613]: default
                      - text: version on Render, which you can override to match your local machine's version.
                      - link "See details." [ref=e614] [cursor=pointer]:
                        - /url: /docs/language-support#set-your-language-version
                    - listitem [ref=e615]:
                      - text: Perform a fresh install of your project on your local machine to confirm that you're using exactly the dependency versions specified in your repository (such as in your
                      - code [ref=e616]: package-lock.json
                      - text: file).
                  - paragraph [ref=e617]:
                    - strong [ref=e618]: Configuration mismatches
                  - list [ref=e619]:
                    - listitem [ref=e620]:
                      - text: Your local machine might set
                      - button "Show definition for environment variable" [ref=e621]: environment variables
                      - text: as part of your app's start script, or via a file like
                      - code [ref=e622]: .env
                      - text: . Make sure you're
                      - link "setting necessary environment variables" [ref=e623] [cursor=pointer]:
                        - /url: /docs/configure-environment-variables
                      - text: on Render as well.
                    - listitem [ref=e624]:
                      - text: When applicable, confirm that you've set necessary configuration to run your app in "production mode" (e.g., by setting
                      - code [ref=e625]: NODE_ENV
                      - text: to
                      - code [ref=e626]: production
                      - text: ).
                    - listitem [ref=e627]:
                      - text: To use any tools or utilities besides those
                      - link "included by default" [ref=e628] [cursor=pointer]:
                        - /url: /docs/native-runtimes#tools-and-utilities
                      - text: in Render's native runtimes, make that sure you install them as part of your app's
                      - button "Show definition for build command" [ref=e629]: build command
                      - text: .
                    - listitem [ref=e630]: Confirm that all of your app's dependencies are compatible with a Linux runtime and file system.
                    - listitem [ref=e631]:
                      - link "Check your logs" [ref=e632] [cursor=pointer]:
                        - /url: "#1-check-the-logs"
                      - text: "to confirm the following:"
                      - list [ref=e633]:
                        - listitem [ref=e634]: Your app's dependencies are all installed as expected.
                        - listitem [ref=e635]: Your service's start command runs and completes successfully.
                  - heading "Common errors" [level=2] [ref=e636]:
                    - link [ref=e637] [cursor=pointer]:
                      - /url: "#common-errors"
                      - img [ref=e638]
                    - text: Common errors
                  - heading "Build & deploy errors" [level=3] [ref=e640]:
                    - link [ref=e641] [cursor=pointer]:
                      - /url: "#build-deploy-errors"
                      - img [ref=e642]
                    - text: Build & deploy errors
                  - paragraph [ref=e644]: "Many first-time build and deploy errors are caused by one of the following issues:"
                  - heading "Missing or incorrectly referenced resources" [level=4] [ref=e645]:
                    - link [ref=e646] [cursor=pointer]:
                      - /url: "#missing-or-incorrectly-referenced-resources"
                      - img [ref=e647]
                    - text: Missing or incorrectly referenced resources
                  - list [ref=e649]:
                    - listitem [ref=e650]:
                      - strong [ref=e651]:
                        - text: Module Not Found /
                        - code [ref=e652]: ModuleNotFoundError
                        - text: ":"
                      - text: "Usually indicates one of the following:"
                      - list [ref=e653]:
                        - listitem [ref=e654]:
                          - text: A referenced dependency was not found (e.g., in your
                          - code [ref=e655]: package.json
                          - text: or
                          - code [ref=e656]: requirements.txt
                          - text: file).
                        - listitem [ref=e657]:
                          - text: A referenced file (such as
                          - code [ref=e658]: app.js
                          - text: or
                          - code [ref=e659]: app.py
                          - text: ) was not found at a specified location.
                        - listitem [ref=e660]: If you're developing on Windows or another platform with a case-insensitive filesystem, make sure that all file paths, names, and extensions are cased correctly. You might need to check the contents of your Git repo directly.
                  - heading "Language / dependency version conflicts" [level=4] [ref=e661]:
                    - link [ref=e662] [cursor=pointer]:
                      - /url: "#language-dependency-version-conflicts"
                      - img [ref=e663]
                    - text: Language / dependency version conflicts
                  - list [ref=e665]:
                    - listitem [ref=e666]:
                      - strong [ref=e667]:
                        - code [ref=e668]: "SyntaxError: Unexpected token '??='"
                        - text: ":"
                      - text: The app's Node.js version doesn't support the indicated operator or method.
                    - listitem [ref=e669]:
                      - strong [ref=e670]:
                        - code [ref=e671]: The engine "node" is incompatible with this module. Expected version…
                        - text: ":"
                      - text: The app's Node.js version doesn't work with the specified module.
                    - listitem [ref=e672]:
                      - strong [ref=e673]:
                        - code [ref=e674]: requires Python >= 3.8
                        - text: ":"
                      - text: A dependency is not compatible with the app's Python version.
                  - heading "Invalid configuration" [level=4] [ref=e675]:
                    - link [ref=e676] [cursor=pointer]:
                      - /url: "#invalid-configuration"
                      - img [ref=e677]
                    - text: Invalid configuration
                  - list [ref=e679]:
                    - listitem [ref=e680]:
                      - strong [ref=e681]:
                        - text: Invalid
                        - button "Show definition for build command" [ref=e682]: build command
                        - text: ":"
                      - text: The
                      - link "command" [ref=e683] [cursor=pointer]:
                        - /url: /docs/deploys#deploy-steps
                      - text: that Render runs to install your project's dependencies and/or perform a build is missing or invalid.
                      - list [ref=e684]:
                        - listitem [ref=e685]: This usually should match the command you run to build your app locally.
                        - listitem [ref=e686]:
                          - text: Common build commands include
                          - code [ref=e687]: npm install
                          - text: (Node.js) and
                          - code [ref=e688]: pip install -r requirements.txt
                          - text: (Python).
                    - listitem [ref=e689]:
                      - strong [ref=e690]:
                        - text: Invalid
                        - button "Show definition for start command" [ref=e691]: start command
                        - text: ":"
                      - text: The
                      - link "command" [ref=e692] [cursor=pointer]:
                        - /url: /docs/deploys#deploy-steps
                      - text: that Render runs to start your app is missing or invalid.
                      - list [ref=e693]:
                        - listitem [ref=e694]: This usually should match the command you run to start your app locally.
                        - listitem [ref=e695]:
                          - text: Common start command formats include
                          - code [ref=e696]: npm start
                          - text: (Node.js) and
                          - code [ref=e697]: gunicorn myapp:app
                          - text: (Python).
                    - listitem [ref=e698]:
                      - strong [ref=e699]:
                        - text: Missing
                        - button "Show definition for environment variable" [ref=e700]: environment variables
                        - text: ":"
                      - text: Some apps require certain environment variables to be set for them to build and start successfully.
                      - list [ref=e701]:
                        - listitem [ref=e702]:
                          - text: Add environment variables to your app in the
                          - link "Render Dashboard" [ref=e703] [cursor=pointer]:
                            - /url: https://dashboard.render.com
                          - text: ", or via a"
                          - code [ref=e704]: render.yaml
                          - link "Blueprint file" [ref=e705] [cursor=pointer]:
                            - /url: /docs/blueprint-spec
                          - text: .
                    - listitem [ref=e706]:
                      - strong [ref=e707]:
                        - text: Missing
                        - link "Dockerfile" [ref=e708] [cursor=pointer]:
                          - /url: /docs/docker
                        - code [ref=e709]: CMD
                        - text: or
                        - code [ref=e710]: ENTRYPOINT
                        - text: ":"
                      - text: If you build and run your app from a
                      - code [ref=e711]: Dockerfile
                      - text: ", that file must include a"
                      - code [ref=e712]: CMD
                      - text: or
                      - code [ref=e713]: ENTRYPOINT
                      - text: directive.
                      - list [ref=e714]:
                        - listitem [ref=e715]: Render uses one of these directives to run your app after the build completes.
                        - listitem [ref=e716]:
                          - text: If you omit
                          - emphasis [ref=e717]: both
                          - text: of these directives, your deploy might appear to hang indefinitely in the
                          - link "Render Dashboard" [ref=e718] [cursor=pointer]:
                            - /url: https://dashboard.render.com
                          - text: .
                    - listitem [ref=e719]:
                      - strong [ref=e720]:
                        - text: Misconfigured
                        - link "health checks" [ref=e721] [cursor=pointer]:
                          - /url: /docs/health-checks
                        - text: ":"
                      - text: If you've added a health check endpoint to your app, Render uses it to verify that your app is responsive before marking it as live.
                      - list [ref=e722]:
                        - listitem [ref=e723]: If the health check endpoint responds with an unexpected value (or doesn't respond at all), Render cancels your deploy.
                  - heading "Runtime errors" [level=3] [ref=e724]:
                    - link [ref=e725] [cursor=pointer]:
                      - /url: "#runtime-errors"
                      - img [ref=e726]
                    - text: Runtime errors
                  - paragraph [ref=e728]:
                    - text: Many common runtime errors surface as
                    - code [ref=e729]: HTTP
                    - text: error codes returned to your browser or other client. For errors returned to your browser, the Network panel of your browser's developer tools helps provide more details about the error.
                  - paragraph [ref=e730]: "Listed below are the most common error codes and some of their most common causes:"
                  - heading "400 Bad Request" [level=4] [ref=e731]:
                    - link [ref=e732] [cursor=pointer]:
                      - /url: "#400-bad-request"
                      - img [ref=e733]
                    - text: 400 Bad Request
                  - list [ref=e735]:
                    - listitem [ref=e736]:
                      - text: A Django app doesn't include its associated
                      - link "custom domain" [ref=e737] [cursor=pointer]:
                        - /url: /docs/custom-domains
                      - text: in its
                      - link "ALLOWED_HOSTS setting" [ref=e738] [cursor=pointer]:
                        - /url: https://docs.djangoproject.com/en/5.0/ref/settings/#allowed-hosts
                        - code [ref=e739]: ALLOWED_HOSTS
                        - text: setting
                      - text: .
                  - heading "404 Not Found" [level=4] [ref=e740]:
                    - link [ref=e741] [cursor=pointer]:
                      - /url: "#404-not-found"
                      - img [ref=e742]
                    - text: 404 Not Found
                  - list [ref=e744]:
                    - listitem [ref=e745]:
                      - text: A static site has misconfigured
                      - link "redirects and/or rewrites" [ref=e746] [cursor=pointer]:
                        - /url: /docs/redirects-rewrites
                      - text: .
                    - listitem [ref=e747]: A web service or static site has misconfigured its routing.
                    - listitem [ref=e748]:
                      - text: "A service is attempting to access a nonexistent file on disk. This might be because:"
                      - list [ref=e749]:
                        - listitem [ref=e750]:
                          - text: The file is no longer available because the service doesn't have a
                          - link "persistent disk" [ref=e751] [cursor=pointer]:
                            - /url: /docs/disks
                          - text: .
                        - listitem [ref=e752]: The service has provided the wrong path (such as by misspelling or incorrectly capitalizing a path component).
                    - listitem [ref=e753]:
                      - text: A Django app is not correctly serving its
                      - link "static files" [ref=e754] [cursor=pointer]:
                        - /url: /docs/deploy-django#set-up-static-file-serving
                      - text: .
                  - heading "500 Internal Server Error" [level=4] [ref=e755]:
                    - link [ref=e756] [cursor=pointer]:
                      - /url: "#500-internal-server-error"
                      - img [ref=e757]
                    - text: 500 Internal Server Error
                  - list [ref=e759]:
                    - listitem [ref=e760]: A service has thrown an uncaught exception while responding to a request, possibly causing the service to crash or restart.
                    - listitem [ref=e761]:
                      - text: A service is experiencing database connection issues, such as
                      - strong [ref=e762]:
                        - code [ref=e763]: SSL connection has been closed unexpectedly
                      - text: .
                      - list [ref=e764]:
                        - listitem [ref=e765]:
                          - text: In this case, setting
                          - code [ref=e766]: sslmode=require
                          - text: and/or a setting up a
                          - link "connection pool" [ref=e767] [cursor=pointer]:
                            - /url: /docs/postgresql-connection-pooling
                          - text: can help.
                    - listitem [ref=e768]:
                      - text: A service or database is overwhelmed, often by too many concurrent connections or constrained resources (such as CPU or RAM).
                      - list [ref=e769]:
                        - listitem [ref=e770]:
                          - text: In this case, warnings about resource constraints usually appear in the service's
                          - link "logs" [ref=e771] [cursor=pointer]:
                            - /url: /docs/logging
                          - text: and on the service's Events page in the
                          - link "Render Dashboard" [ref=e772] [cursor=pointer]:
                            - /url: https://dashboard.render.com
                          - text: .
                        - listitem [ref=e773]:
                          - text: To resolve, consider
                          - link "scaling" [ref=e774] [cursor=pointer]:
                            - /url: /docs/scaling
                          - text: your service to help alleviate load.
                  - heading "502 Bad Gateway" [level=4] [ref=e775]:
                    - link [ref=e776] [cursor=pointer]:
                      - /url: "#502-bad-gateway"
                      - img [ref=e777]
                    - text: 502 Bad Gateway
                  - list [ref=e779]:
                    - listitem [ref=e780]:
                      - text: A web service has misconfigured its
                      - link "host and port" [ref=e781] [cursor=pointer]:
                        - /url: /docs/web-services#port-binding
                      - text: .
                      - list [ref=e782]:
                        - listitem [ref=e783]:
                          - text: Bind your host to
                          - code [ref=e784]: 0.0.0.0
                          - text: and optionally set the
                          - code [ref=e785]: PORT
                          - text: environment variable to use a custom port (the default port is
                          - code [ref=e786]: "10000"
                          - text: ).
                    - listitem [ref=e787]:
                      - text: A newly added
                      - link "custom domain" [ref=e788] [cursor=pointer]:
                        - /url: /docs/custom-domains
                      - text: is not yet redirecting to its web service.
                      - list [ref=e789]:
                        - listitem [ref=e790]: In most cases this resolves within a few minutes, but it might take up to an hour.
                    - listitem [ref=e791]:
                      - text: A Node.js web service is experiencing intermittent timeouts or
                      - code [ref=e792]: Connection reset by peer
                      - text: errors. Try increasing the values for
                      - code [ref=e793]: server.keepAliveTimeout
                      - text: and
                      - code [ref=e794]: server.headersTimeout
                      - text: (such as to
                      - code [ref=e795]: "120000"
                      - text: for 120 seconds).
                    - listitem [ref=e796]:
                      - text: A service is experiencing
                      - code [ref=e797]: WORKER
                      - text: ","
                      - code [ref=e798]: SIGKILL
                      - text: ", or"
                      - code [ref=e799]: SIGTERM
                      - text: warnings (e.g.,
                      - code [ref=e800]: "[CRITICAL] WORKER TIMEOUT"
                      - text: ).
                      - list [ref=e801]:
                        - listitem [ref=e802]:
                          - text: Consider increasing your timeout values and worker limits (e.g., via the
                          - code [ref=e803]: gunicorn
                          - link "timeout parameter" [ref=e804] [cursor=pointer]:
                            - /url: https://docs.gunicorn.org/en/stable/settings.html#timeout
                          - text: ).
                  - heading "When to contact support" [level=2] [ref=e805]:
                    - link [ref=e806] [cursor=pointer]:
                      - /url: "#when-to-contact-support"
                      - img [ref=e807]
                    - text: When to contact support
                  - paragraph [ref=e809]: Render's support team is available and happy to assist with issues that are specific to the capabilities, conventions, and underlying infrastructure of our platform.
                  - paragraph [ref=e810]:
                    - strong [ref=e811]:
                      - text: Our support team
                      - emphasis [ref=e812]: cannot
                      - text: "assist with more general development issues like the following:"
                  - list [ref=e813]:
                    - listitem [ref=e814]: Debugging of application code
                    - listitem [ref=e815]: Software design and architecture
                    - listitem [ref=e816]: Performance optimization
                    - listitem [ref=e817]: Programming nuances specific to a particular library or framework
                  - paragraph [ref=e818]: For help with issues like these, please consult sites and services that specialize in these forms of assistance.
            - generic [ref=e820]:
