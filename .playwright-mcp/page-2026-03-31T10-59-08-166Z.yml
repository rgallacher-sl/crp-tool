          - generic [ref=e137]:
            - paragraph [ref=e138]: Apply for funding to test and rigorously evaluate the effectiveness of interventions aimed at spreading opportunities and reducing disparities in economic, health and social outcomes for people and places across the UK.
            - paragraph [ref=e139]: You must be based at a UK research organisation eligible for UK Research and Innovation (UKRI) funding.
            - paragraph [ref=e140]: The full economic cost of your project can be between £1,000,000 and £2,500,000. UKRI will fund 80% of the full economic cost.
            - paragraph [ref=e141]: Projects should last between 13 and 48 months and must start by 1 July 2024.
