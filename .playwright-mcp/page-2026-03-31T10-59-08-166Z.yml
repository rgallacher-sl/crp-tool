              - generic "Additional info" [ref=e783]:
                - heading "Background" [level=3] [ref=e784]
                - paragraph [ref=e785]:
                  - text: “Creating Opportunities, Improving Outcomes” is one of five strategic themes set out in UKRI’s Strategy,
                  - link "Transforming Tomorrow Together 2022 to 2027" [ref=e786] [cursor=pointer]:
                    - /url: /publications/ukri-strategy-2022-to-2027/
                  - text: . The theme addresses the causes and effects of place-based disparities and aims to identify empowering new solutions that promote prosperity and improve outcomes for people and communities across the UK.
                - paragraph [ref=e787]: Investments made under the theme are intended to develop the capacity of the research and innovation system to work at a local and national level in testing approaches that accelerate prosperity and support the scaling of effective practices.
                - paragraph [ref=e788]: The theme is led by the ESRC’s Executive Chair, supported by a programme board made up of representatives from across UKRI’s research councils.
                - paragraph [ref=e789]: For the purposes of this funding opportunity, research trials are defined as studies in which participants (people, organisations, places etc.) receive specific interventions in accordance with a research plan or protocol that allows for the effectiveness of that intervention to be understood. The funders are particularly interested in the use of randomised controlled trials and quasi-experimental methods to understand the effectiveness of different interventions. However, in some contexts, other approaches such as observational studies or theory-based evaluations may be more appropriate.
                - paragraph [ref=e790]:
                  - text: In developing this funding opportunity, the funders have drawn on the experience of the Cabinet Office-administered
                  - link "Evaluation Accelerator Fund" [ref=e791] [cursor=pointer]:
                    - /url: https://www.gov.uk/government/publications/evaluation-accelerator-fund
                  - text: that was announced by the chancellor in the autumn 2021 budget.
                - heading "Supporting links" [level=3] [ref=e792]
                - paragraph [ref=e793]: "If applying to use experimental approaches to evaluate public health interventions, applicants are encouraged to make use of the following resources:"
                - list [ref=e794]:
                  - listitem [ref=e795]:
                    - link "MRC policy on registration and publication of clinical trials and public health intervention studies" [ref=e796] [cursor=pointer]:
                      - /url: /publications/open-research-data-from-clinical-trials-and-public-health-intervention-studies/
                  - listitem [ref=e797]:
                    - text: "RSC:"
                    - link "MRC Regulatory Support Centre" [ref=e798] [cursor=pointer]:
                      - /url: /councils/mrc/facilities-and-resources/find-an-mrc-facility-or-resource/mrc-regulatory-support-centre/
                  - listitem [ref=e799]:
                    - link "TMRP resources" [ref=e800] [cursor=pointer]:
                      - /url: https://www.methodologyhubs.mrc.ac.uk/advice/network-guidance/
                  - listitem [ref=e801]:
                    - text: "HRA:"
                    - link "Increasing the diversity of people taking part in research" [ref=e802] [cursor=pointer]:
                      - /url: https://www.hra.nhs.uk/planning-and-improving-research/best-practice/increasing-diversity-people-taking-part-research/
                  - listitem [ref=e803]:
                    - text: "NIHR:"
                    - link "Innovations in Clinical Trial Design and Delivery for the Under-served (INCLUDE) | NIHR" [ref=e804] [cursor=pointer]:
                      - /url: https://www.nihr.ac.uk/documents/improving-inclusion-of-under-served-groups-in-clinical-research-guidance-from-include-project/25435
                - paragraph [ref=e805]:
                  - text: The above is not an exhaustive list and will depend on the thematic remit of your proposed trial. For example, the Education Endowment Foundation (EEF) also provides evaluation guidance and resources,
                  - link "Evaluation guidance and resources | EEF (educationendowmentfoundation.org.uk)" [ref=e806] [cursor=pointer]:
                    - /url: https://educationendowmentfoundation.org.uk/projects-and-evaluation/evaluation/evaluation-guidance-and-resources
                  - text: ", for those undertaking randomised control trials and other evaluations in schools."
                - heading "Global Talent visa" [level=3] [ref=e807]
                - paragraph [ref=e808]:
                  - text: Fellowship holders are eligible for a
                  - link "Global Talent visa" [ref=e809] [cursor=pointer]:
                    - /url: /what-we-offer/international-funding/get-funding-and-visas-to-do-research-in-the-uk/
                  - text: under the ‘exceptional promise’ category for future research leaders.
                - heading "Research disruption due to COVID-19" [level=3] [ref=e810]
                - paragraph [ref=e811]: "We recognise that the COVID-19 pandemic has caused major interruptions and disruptions across our communities. We are committed to ensuring that individual applicants and their wider team, including partners and networks, are not penalised for any disruption to their career, such as:"
                - list [ref=e812]:
                  - listitem [ref=e813]: breaks and delays
                  - listitem [ref=e814]: disruptive working patterns and conditions
                  - listitem [ref=e815]: the loss of ongoing work
                  - listitem [ref=e816]: role changes that may have been caused by the pandemic
                - paragraph [ref=e817]: Reviewers and panel members will be advised to consider the unequal impacts that COVID-19 related disruption might have had on the capability to deliver and career development of those individuals included in the application. They will be asked to consider the capability of the applicant and their wider team to deliver the research they are proposing.
                - paragraph [ref=e818]: Where disruptions have occurred, you can highlight this within your application if you wish, but there is no requirement to detail the specific circumstances that caused the disruption.
