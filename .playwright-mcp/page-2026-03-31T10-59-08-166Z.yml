              - generic "How we will assess your application" [ref=e732]:
                - heading "Assessment process" [level=3] [ref=e733]
                - paragraph [ref=e734]: We will assess your application using the following process.
                - heading "Peer Review" [level=4] [ref=e735]
                - paragraph [ref=e736]: Following eligibility checks, we will invite experts to review your application independently against the specified criteria for this opportunity.
                - paragraph [ref=e737]: Applications are sent to three reviewers. Sometimes more reviewers will be approached depending on the nature of the project.
                - paragraph [ref=e738]: Applicants to opportunities offered through the new Funding Service will not be able to nominate reviewers for their applications. Expert reviewers will continue to be selected by research councils.
                - paragraph [ref=e739]: We are monitoring the requirement for applicant-nominated reviewers as we review policies and processes as part of the continued development of the new UKRI Funding Service.
                - heading "Application sift and applicant response" [level=4] [ref=e740]
                - paragraph [ref=e741]: Applications receiving sufficiently supportive reviewers’ comments (average score of 4.5 or above on a one to six scale) will be invited to respond to reviewers’ comments. You will be given 14 calendar days to provide a response or ten working days if longer. Applications with an average score below 4.5 will normally be rejected at this stage.
                - heading "Panel" [level=4] [ref=e742]
                - paragraph [ref=e743]: Following peer review, we will invite peers to collectively review your application against the criteria and rank it alongside other applications after which the panel will make a funding recommendation.
                - paragraph [ref=e744]: "In making a funding recommendation, the panel will also seek to ensure a balanced portfolio of awards across the three thematic areas of the priority. These are:"
                - list [ref=e745]:
                  - listitem [ref=e746]: sustainable economic growth and innovation
                  - listitem [ref=e747]: health inequalities
                  - listitem [ref=e748]: community connectedness
                - heading "Timescale" [level=4] [ref=e749]
                - paragraph [ref=e750]: We aim to complete the assessment process by May 2024.
                - heading "Principles of assessment" [level=3] [ref=e751]
                - paragraph [ref=e752]:
                  - text: We support the San Francisco
                  - link "declaration on research assessment (DORA)" [ref=e753] [cursor=pointer]:
                    - /url: https://sfdora.org/read/
                  - text: and recognise the relationship between research assessment and research integrity.
                - paragraph [ref=e754]:
                  - text: Find out about the
                  - link "UKRI Principles of Assessment and Decision Making" [ref=e755] [cursor=pointer]:
                    - /url: /publications/ukri-principles-of-assessment-and-decision-making/
                  - text: .
                - paragraph [ref=e756]: We reserve the right to modify the assessment process as needed.
                - heading "Assessment criteria" [level=3] [ref=e757]
                - paragraph [ref=e758]: The criteria we will assess your application against are Vision, Approach, Applicant and team capability to deliver, Resources and cost justification, Ethics and Responsible Research and Innovation (RRI) listed under the ‘Questions and criteria’ heading in the ‘How to apply’ section.
