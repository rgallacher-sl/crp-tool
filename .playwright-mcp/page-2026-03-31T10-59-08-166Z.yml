            - generic [ref=e146]:
              - heading "Who can apply" [level=2] [ref=e148] [cursor=pointer]:
                - button "Who can apply" [expanded] [ref=e149]
              - generic "Who can apply" [ref=e300]:
                - paragraph [ref=e301]: "Before applying for funding, check the following:"
                - list [ref=e302]:
                  - listitem [ref=e303]:
                    - link "the eligibility of your organisation" [ref=e304] [cursor=pointer]:
                      - /url: /apply-for-funding/before-you-apply/check-if-you-are-eligible-for-research-and-innovation-funding/eligibility-as-an-organisation/#contents-list
                - paragraph [ref=e305]: UKRI is introducing new role types for opportunities being run on the new Funding Service.
                - paragraph [ref=e306]:
                  - text: For full details please see
                  - link "eligibility as an individual" [ref=e307] [cursor=pointer]:
                    - /url: /apply-for-funding/before-you-apply/check-if-you-are-eligible-for-research-and-innovation-funding/eligibility-as-an-individual/#contents-list
                - heading "Who is eligible to apply" [level=3] [ref=e308]
                - paragraph [ref=e309]: This is a UKRI wide funding opportunity.
                - paragraph [ref=e310]: The project lead for this funding opportunity must be based at an organisation eligible for UKRI funding for the duration of the grant.
                - paragraph [ref=e311]: Applications may be submitted jointly by more than one applicant. In such cases, one person must be regarded as the project lead taking the lead responsibility for the conduct of the project and the observance of the terms and conditions.
                - paragraph [ref=e312]: Correspondence regarding the proposal and grant will be addressed to the project lead only (and in the case of any offer letter, to their research office).
                - paragraph [ref=e313]: All project co-leads must make a significant contribution to the conduct of the project.
                - paragraph [ref=e314]:
                  - text: See the ESRC
                  - link "Research Funding Guide" [ref=e315] [cursor=pointer]:
                    - /url: /publications/esrc-research-funding-guide/
                  - text: for further information on costs that can be included
                - heading "International applicants" [level=3] [ref=e316]
                - paragraph [ref=e317]: Project leads from non-UK organisations are not eligible to apply for funding for this opportunity.
                - paragraph [ref=e318]:
                  - text: Project co-leads based in non-UK research organisations can be included in research grant applications. Read
                  - link "project co-lead (international) policy guidance – ESRC" [ref=e319] [cursor=pointer]:
                    - /url: /publications/international-co-investigator-policy-guidance/
                  - text: for details of eligible organisations and costs.
                - heading "Business, third sector or government body project co-leads" [level=3] [ref=e320]
                - paragraph [ref=e321]:
                  - text: Business, third sector or government body project co-leads based in the UK can also be included on research grant proposals as a project co-lead. Read
                  - link "Including project co-leads from business, third sector or government bodies – ESRC" [ref=e322] [cursor=pointer]:
                    - /url: /publications/including-co-investigators-from-business-third-sector-or-government-bodies/
                  - text: for details of eligible organisations and costs.
                - heading "Equality, diversity and inclusion" [level=3] [ref=e323]
                - paragraph [ref=e324]: We are committed to achieving equality of opportunity for all funding applicants. We encourage applications from a diverse range of researchers.
                - paragraph [ref=e325]: "We support people to work in a way that suits their personal circumstances. This includes:"
                - list [ref=e326]:
                  - listitem [ref=e327]: career breaks
                  - listitem [ref=e328]: support for people with caring responsibilities
                  - listitem [ref=e329]: flexible working
                  - listitem [ref=e330]: alternative working patterns
                  - listitem [ref=e331]: joint lead applicants
                - paragraph [ref=e332]:
                  - text: Find out more about
                  - link "equality, diversity and inclusion at UKRI" [ref=e333] [cursor=pointer]:
                    - /url: /what-we-offer/supporting-healthy-research-and-innovation-culture/equality-diversity-and-inclusion/
                  - text: .
            - generic [ref=e151]:
              - heading "What we're looking for" [level=2] [ref=e153] [cursor=pointer]:
                - button "What we're looking for" [expanded] [ref=e154]
              - generic "What we're looking for" [ref=e334]:
                - paragraph [ref=e335]:
                  - text: This opportunity falls under UKRI’s “
                  - link "Creating Opportunities, Improving Outcomes" [ref=e336] [cursor=pointer]:
                    - /url: /what-we-offer/browse-our-areas-of-investment-and-support/creating-opportunities-and-improving-outcomes/
                  - text: ” strategic theme, which seeks to improve outcomes for people and places across the UK by identifying solutions that promote economic and social prosperity.
                - heading "Scope" [level=3] [ref=e337]
                - paragraph [ref=e338]: The UKRI Creating Opportunities Trial Accelerator Fund is aimed at enabling the research and innovation community to test interventions that will spread opportunities and reduce spatial disparities in economic, health and social outcomes for people and places across the UK by using, primarily, robust counterfactual impact evaluation methods.
                - paragraph [ref=e339]: In doing so, grant holders will help address gaps and weaknesses in the existing evidence base underpinning the thematic areas covered by the UKRI “Creating Opportunities, Improving Outcomes” strategic theme.
                - heading "Objectives" [level=3] [ref=e340]
                - paragraph [ref=e341]: "The overarching objectives are to:"
                - list [ref=e342]:
                  - listitem [ref=e343]: generate causal evidence on what works to spread opportunities and reduce spatial disparities in outcomes for people and places across the UK
                  - listitem [ref=e344]: accelerate the development of innovative and ethical methods for robustly testing and evaluating the impact of interventions related to the thematic areas outlined below
                  - listitem [ref=e345]: build the capacity of the research and innovation system to forge interdisciplinary collaborations and lasting partnerships with local communities (including those with lived experience) in designing and delivering robust research trials and related evaluation activity
                  - listitem [ref=e346]: provide actionable evidence that responds to the needs of decision makers and informs policy or practice at a local, regional, national, or international scale
                - heading "Thematic areas" [level=3] [ref=e347]
                - paragraph [ref=e348]: "Proposals will be required to address one or more of the following three thematic areas:"
                - list [ref=e349]:
                  - listitem [ref=e350]: "sustainable economic growth and innovation: addressing long-standing regional economic disparities and delivering solutions that focus on sustainable, inclusive growth and innovation"
                  - listitem [ref=e351]: "Place-based health inequalities: identifying sustainable and cost-effective solutions to address spatial disparities in population health across the UK; the term “health inequalities” is used to refer to varying definitions of inequality and inequity, including the unfair and avoidable differences in health across different groups"
                  - listitem [ref=e352]: "community connectedness: strengthening civic engagements, relationships, trust, and local pride to reduce the social and economic marginalisation of groups and areas"
                - paragraph [ref=e353]: In addressing one or more of the above themes, you will need to consider the role of place and the implications that the proposed activity will have on spatial inequalities, as explained below in the sub-section “Place”.
                - heading "Place" [level=4] [ref=e354]
                - paragraph [ref=e355]: The fund will support research trials that have the potential to deliver a step-change in approaches to reducing place-based inequalities. Therefore, proposals must demonstrate how the role of place has been considered.
                - paragraph [ref=e356]: For example, you could evaluate place-focused interventions or place agnostic interventions involving individuals, groups or organisations that have clear implications for addressing place-based inequalities.
                - paragraph [ref=e357]: You must provide a rationale for your approach to defining the geography most relevant to your proposed activity and explain how the proposed activity could support the reduction of place-based inequalities.
                - paragraph [ref=e358]: You should consider the potential to extrapolate learning from your proposed research trials to address placed-based inequalities in other areas of the UK. If research trials are conducted in a single locality or small number of research sites, you should set out how your findings will be applicable to other areas.
                - paragraph [ref=e359]: To support a focus on place, successful applicants will be expected to engage with a strategic coordination hub that will be commissioned to support grant holders via a series of grant holder workshops and events to showcase findings. Projects should budget sufficient travel and subsistence costs to attend at least four one-day programme events based in the UK.
                - heading "Employing experimental and quasi-experimental approaches" [level=3] [ref=e360]
                - paragraph [ref=e361]: "The fund will support ambitious research trials that are focused on tackling urgent local and regional inequalities within the UK under one or more of the above themes (see ‘Thematic areas’). We will primarily fund research trials, which:"
                - list [ref=e362]:
                  - listitem [ref=e363]: use experimental approaches such as randomised control trials (RCTs) where participants are allocated prospectively and randomly to treatment groups that receive interventions and control or comparison groups that do not
                - paragraph [ref=e364]: "or:"
                - list [ref=e365]:
                  - listitem [ref=e366]: where random allocation is not possible, practical, or ethical, use quasi-experimental approaches to compare outcomes for groups that have been exposed to an intervention or policy and estimate an appropriate comparison group
                - paragraph [ref=e367]: "We will fund trials at a variety of scales. This includes:"
                - list [ref=e368]:
                  - listitem [ref=e369]: pilot studies where an intervention is at an early stage of development. Evaluation activity would be focused on developing and refining the approach and testing the feasibility of the intervention. Initial, indicative data would be collected to assess the intervention’s potential to improve outcomes
                  - listitem [ref=e370]: efficacy trials where an intervention or programme is tested under controlled conditions. Evaluation activity would be focused on assessing the impact of the intervention on outcomes of interest, supported by an implementation and process evaluation to identify delivery challenges
                  - listitem [ref=e371]: effectiveness trials that test a scalable intervention under everyday conditions. Evaluation activity would be focused on assessing the impact of the intervention on outcomes of interest, supported by an implementation and process evaluation to identify the challenges for delivery at scale
                - paragraph [ref=e372]:
                  - text: "(This categorisation is based on the Education Endowment Foundation’s (EEF) ‘Pipeline of EEF trials’:"
                  - link "Pipeline of EEF trials | EEF (educationendowmentfoundation.org.uk)" [ref=e373] [cursor=pointer]:
                    - /url: https://educationendowmentfoundation.org.uk/projects-and-evaluation/evaluation/process-and-people/pipeline-of-eef-trials
                - paragraph [ref=e374]: You may propose a single trial (including multiarm trials that test multiple interventions or variations of an intervention) or a programme of trials.
                - paragraph [ref=e375]: If proposing a programme of trials, individual trials can run concurrently or be sequenced. If you propose undertaking pilot studies, there is an expectation that proposals also include plans to test the intervention under controlled conditions if found to be feasible.
                - paragraph [ref=e376]: Proposals are also welcome from applicants proposing to conduct rapid RCTs or the use of rapid-cycle RCTs.
                - heading "Alternative Methods" [level=4] [ref=e377]
                - paragraph [ref=e378]: For some interventions it may not be possible to use either experimental or quasi-experimental approaches.
                - paragraph [ref=e379]: Although the primary aim of this fund is to support experimental and quasi-experimental impact evaluation approaches, we may also fund projects that partially or largely employ alternative methods such as theory-based approaches to impact evaluation providing that clear justification has been provided for employing these methodologies.
                - paragraph [ref=e380]:
                  - text: "Further guidance on designing an evaluation using experimental, quasi-experimental or theory-based approaches can be found in HM Treasury (2020) The Magenta Book: Guidance for Evaluation,"
                  - link "The Magenta Book – GOV.UK" [ref=e381] [cursor=pointer]:
                    - /url: https://www.gov.uk/government/publications/the-magenta-book
                  - text: .
                - heading "Requirements" [level=3] [ref=e382]
                - paragraph [ref=e383]: "Proposals should also address the following requirements:"
                - heading "Interventions" [level=4] [ref=e384]
                - paragraph [ref=e385]: Proposals must clearly identify a specific intervention or series of interventions they intend to evaluate. This could include interventions that are already being delivered on the ground but have not previously been robustly evaluated or testing and evaluating new interventions.
                - paragraph [ref=e386]: You should explain the rationale for the intervention(s), what is being delivered, and how it links to outcomes of interest.
                - paragraph [ref=e387]: You should clearly set out how the outcomes being measured relate to one or more of the three thematic areas of this opportunity, as set out in the ‘Thematic areas’ section.
                - paragraph [ref=e388]: Proposals should also demonstrate how the intervention(s) and approach to evaluation address an evidence gap for decision makers and practitioners involved in policymaking or the delivery of services including, where possible, how the evaluation proposed will help to inform and improve the delivery of the intervention.
                - heading "Impact evaluation designs" [level=4] [ref=e389]
                - paragraph [ref=e390]: This funding opportunity is primarily aimed at supporting research trials that use experimental or quasi-experimental methods.
                - paragraph [ref=e391]: "Proposals should describe appropriate methodological approaches and techniques that will be used for the impact evaluation, including where appropriate:"
                - list [ref=e392]:
                  - listitem [ref=e393]: how randomisation will be achieved
                  - listitem [ref=e394]: how comparison groups will be established to enable a valid comparison of outcomes
                  - listitem [ref=e395]: what outcomes will be captured and the rationale for these
                  - listitem [ref=e396]: datasets or instruments that will be used to measure these
                  - listitem [ref=e397]: how data will be collected, including capitalising where appropriate on existing data to reduce costs and the burden on participants; and
                  - listitem [ref=e398]: how data will be analysed to deliver against the research objectives and provide robust findings
                - paragraph [ref=e399]: Applicants proposing to partially or largely use alternative methods such as theory-based approaches to impact evaluation should explain why these methods are appropriate.
                - heading "Supporting impact evaluations with an implementation and process evaluation" [level=4] [ref=e400]
                - paragraph [ref=e401]
                - paragraph [ref=e402]: To ensure that the causal factors and mechanisms for the impact of an intervention are also captured and well understood, applicants are strongly encouraged to include, where appropriate, an evaluation of the delivery of the intervention paying attention to issues of compliance and programme fidelity.
                - paragraph [ref=e403]: Where an implementation and process evaluation are included in a proposal, you should provide a clear rationale and description of your intended methodological approach.
                - heading "Building interdisciplinary collaborations and partnerships" [level=4] [ref=e404]
                - paragraph [ref=e405]: This funding opportunity aims to harness the knowledge and expertise of the various research communities supported by UKRI and enable working across disciplines to leverage knowledge and expertise in addressing its objectives. We particularly welcome interdisciplinary collaborations that build the capacity of a broad range of disciplines to use experimental and quasi-experimental methods in understanding what works to spread opportunities and reduce spatial disparities in outcomes for people and places across the UK.
                - paragraph [ref=e406]: To ensure proposals are feasible and grounded in local priorities, you are strongly encouraged to engage community partners and those with lived experience in the development of bids. Engagement with communities must be equitable and your plans must demonstrate that you have identified their needs and interests, and the ways in which they will positively benefit from participating in the project.
                - paragraph [ref=e407]: The funding available can only be used for evaluation purposes and not for the delivery of the interventions. Therefore, partnerships with non-academic organisations that will be funding or delivering the intervention will be essential to a competitive proposal.
                - paragraph [ref=e408]: You should demonstrate that an equitable and sustainable partnership with co-creation and co-delivery at its heart has been established.
                - paragraph [ref=e409]: "A non-exhaustive list of the type of non-academic organisations that could be involved in projects include:"
                - list [ref=e410]:
                  - listitem [ref=e411]: local authorities
                  - listitem [ref=e412]: healthcare delivery organisations
                  - listitem [ref=e413]: regional or local industrial bodies
                  - listitem [ref=e414]: community groups
                  - listitem [ref=e415]: charities
                  - listitem [ref=e416]: schools and colleges
                  - listitem [ref=e417]: government departments
                  - listitem [ref=e418]: devolved administrations
                  - listitem [ref=e419]: other public sector organisations
                  - listitem [ref=e420]: private sector partners
                - paragraph [ref=e421]:
                  - text: More information on including project co-leads and partners can be found in the
                  - link "ESRC Research Funding Guide" [ref=e422] [cursor=pointer]:
                    - /url: /publications/esrc-research-funding-guide/
                  - text: .
                - heading "Ethical and data management considerations" [level=4] [ref=e423]
                - paragraph [ref=e424]: We require that the research we support is designed and conducted in such a way that it
                - paragraph [ref=e425]:
                  - text: meets ethical principles and is subject to proper professional and institutional oversight in terms of research governance. We have agreed a Framework for Research Ethics that all submitted proposals must comply with. Read further details about the
                  - link "Framework for Research Ethics and guidance on compliance" [ref=e426] [cursor=pointer]:
                    - /url: /councils/esrc/guidance-for-applicants/research-ethics-guidance/
                  - text: .
                - paragraph [ref=e427]:
                  - text: Grant holders will be expected to follow good practice in producing trial or research protocols that set out the key features of their research plan following appropriate guidance prior to the start of funded trials. We also strongly recommend that trials are registered in an appropriate register (e.g.,
                  - link "ISRCTN" [ref=e428] [cursor=pointer]:
                    - /url: https://www.isrctn.com/
                  - text: ","
                  - link "AEA" [ref=e429] [cursor=pointer]:
                    - /url: https://www.socialscienceregistry.org/
                  - text: ","
                  - link "IGL database" [ref=e430] [cursor=pointer]:
                    - /url: https://www.innovationgrowthlab.org/igl-database-v2
                  - text: ). You can include any registration costs in your requested budget.
                - paragraph [ref=e431]:
                  - text: Data collection and management should be in accordance with ESRC
                  - link "research data policy" [ref=e432] [cursor=pointer]:
                    - /url: /publications/esrc-research-data-policy/
                  - text: .
                - paragraph [ref=e433]: Results of the studies, whether positive or negative, must be published or made publicly available within 24 months of the end of the study or trial. Publications must cite the grant reference number.
                - paragraph [ref=e434]: You must ensure plans to meet these ethics and transparency requirements are included in their proposal.
                - paragraph [ref=e435]: A list of additional guidance on good practice can be found in the ‘Related Content’ section.
                - heading "Using existing datasets" [level=4] [ref=e436]
                - paragraph [ref=e437]: UKRI supports a range of data resources. Where relevant, we encourage applicants to consider whether the use of these resources could add value to the project.
                - paragraph [ref=e438]: "Please find more details about the datasets available across the UK on Facilities and resources:"
                - paragraph [ref=e439]:
                  - link "Facilities and resources – BBSRC – UKRI" [ref=e440] [cursor=pointer]:
                    - /url: /councils/bbsrc/facilities-and-resources/
                - paragraph [ref=e441]:
                  - link "Facilities and resources – EPSRC – UKRI" [ref=e442] [cursor=pointer]:
                    - /url: /councils/epsrc/facilities-and-resources/
                - paragraph [ref=e443]:
                  - link "Facilities and resources – ESRC – UKRI" [ref=e444] [cursor=pointer]:
                    - /url: /councils/esrc/facilities-and-resources/
                  - text: (including ADR UK)
                - paragraph [ref=e445]:
                  - link "Facilities and resources – MRC – UKRI" [ref=e446] [cursor=pointer]:
                    - /url: /councils/mrc/facilities-and-resources/
                - paragraph [ref=e447]:
                  - link "Facilities and resources – NERC – UKRI" [ref=e448] [cursor=pointer]:
                    - /url: /councils/nerc/facilities-and-resources/
                - paragraph [ref=e449]:
                  - link "Facilities and resources – STFC – UKRI" [ref=e450] [cursor=pointer]:
                    - /url: /councils/stfc/facilities-and-resources/
                - paragraph [ref=e451]: Details of any datasets and infrastructure to be used in your project should be given in the Facilities section.
                - heading "A related funding opportunity" [level=3] [ref=e452]
                - paragraph [ref=e453]: The UKRI Creating Opportunities Trial Accelerator Fund is one of two funding opportunities focused on supporting evaluation activity under UKRI’s “Creating Opportunities, Improving Outcomes” strategic theme.
                - paragraph [ref=e454]: The second opportunity is for the UKRI Creating Opportunities Evaluation Development Fund, which will be open during the same period. Although both opportunities have the same thematic focus, the duration, funding available, and requirements differ.
                - paragraph [ref=e455]: You cannot submit the same or similar proposals to both funding opportunities. Applicants that submit the same or a similar proposal to both will be withdrawn from the UKRI Creating Opportunities Evaluation Development Fund.
                - heading "Additional Information" [level=3] [ref=e456]
                - heading "Duration" [level=4] [ref=e457]
                - paragraph [ref=e458]: Projects should last for between 13 months and 48 months. Grants should start by 1 July 2024.
                - paragraph [ref=e459]:
                  - text: Applicants wishing to undertake projects lasting 12 months or less should review details of the
                  - link "UKRI Creating Opportunities Evaluation Development Fund" [ref=e460] [cursor=pointer]:
                    - /url: /opportunity/creating-opportunities-evaluation-development-fund/
                  - text: .
                - heading "Funding available" [level=4] [ref=e461]
                - paragraph [ref=e462]: The full economic cost of your project can range from £1,000,000 to £2,500,000.
                - paragraph [ref=e463]: UKRI will fund 80% of the full economic cost.
                - heading "What we will fund" [level=4] [ref=e464]
                - paragraph [ref=e465]: "You can request funding for costs primarily relating to undertaking the evaluation activities:"
