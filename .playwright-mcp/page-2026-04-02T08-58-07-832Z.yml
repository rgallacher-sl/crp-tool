                      - heading "Contextualize errors" [level=3] [ref=e393]
                    - paragraph [ref=e394]: "Error messages can be standalone field errors resulting from validation or be more complex requiring users take action on multiple elements across pages. In either case, provide error messages to users in the context of where the error occurred when possible, accounting for the scale and criticality of these errors. For example:"
                    - list [ref=e395]:
                      - listitem [ref=e396]:
                        - paragraph [ref=e397]: Show inline field error message for standalone field errors resulting from client side validation.
                      - listitem [ref=e398]:
                        - paragraph [ref=e399]: Show a page level error alert above the submit button for an error resulting from server side validation.
                      - listitem [ref=e400]:
                        - paragraph [ref=e401]: Show a page level flashbar for an error returned due to failure in deleting a resource.
                      - listitem [ref=e402]:
                        - paragraph [ref=e403]: Show an error alert where a component failed to render.
