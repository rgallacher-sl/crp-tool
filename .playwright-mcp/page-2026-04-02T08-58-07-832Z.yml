                        - paragraph [ref=e467]: Follow the guidelines on alternative text and Accessible Rich Internet Applications (ARIA) regions for each component.
                      - listitem [ref=e468]:
                        - paragraph [ref=e469]: Make sure to define ARIA labels aligned with the language context of your application.
