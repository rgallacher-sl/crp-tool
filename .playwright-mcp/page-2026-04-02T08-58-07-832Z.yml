                      - heading "Form or field validation" [level=3] [ref=e342]
                    - paragraph [ref=e343]:
                      - text: Client or server side errors that occur as a result of validation on a form, field, or flow. They usually require a user to perform an action on that field, form, or another page to remediate the error. Refer to the
                      - link "validation" [ref=e344]:
                        - /url: /patterns/general/errors/validation/
                      - text: pattern for details on scenarios and guidelines on addressing them.
                    - generic [ref=e345]:
                      - button "Copy link to Component specific functional errors section" [ref=e350] [cursor=pointer]:
                        - generic [ref=e351]:
                          - img
                      - heading "Component specific functional errors" [level=3] [ref=e352]
                    - paragraph [ref=e353]: "Errors that occur in a component due to fetching or loading issues. For example:"
                    - list [ref=e354]:
                      - listitem [ref=e355]:
                        - paragraph [ref=e356]:
                          - text: The
                          - link "autosuggest" [ref=e357]:
                            - /url: /components/autosuggest/
                          - text: has a built-in error state that is displayed when an error occurs while getting suggestions based on the user's entered query.
                      - listitem [ref=e358]:
                        - paragraph [ref=e359]:
                          - text: The
                          - link "multiselect" [ref=e360]:
                            - /url: /components/multiselect/
                          - text: component error state occurs when it fails at fetching options (for example, if the API fails to load the next set of options in the list).
                      - listitem [ref=e361]:
                        - paragraph [ref=e362]:
                          - text: The
                          - link "code editor" [ref=e363]:
                            - /url: /components/code-editor/
                          - text: error state is displayed when the component fails to load.
                      - listitem [ref=e364]:
                        - paragraph [ref=e365]:
                          - text: The individual
                          - link "charts" [ref=e366]:
                            - /url: /components/bar-chart/?tabId=playground&example=error
                          - text: components have an error state that is displayed when they fail to fetch data.
                    - generic [ref=e367]:
                      - button "Copy link to Unexpected client-side errors section" [ref=e372] [cursor=pointer]:
                        - generic [ref=e373]:
                          - img
                      - heading "Unexpected client-side errors" [level=3] [ref=e374]
                    - paragraph [ref=e375]: Errors that occur due to a technical malfunction. For example, when a component fails to render. The cause of these errors is usually unknown, and there might not be a clear action to fix it. Instead, users can report the problem, and then reload the page or retry the operation again later.
                  - generic [ref=e377]:
                    - generic [ref=e378]:
                      - button "Copy link to Key UX concepts section" [ref=e383] [cursor=pointer]:
                        - generic [ref=e384]:
