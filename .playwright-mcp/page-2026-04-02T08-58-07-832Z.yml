                          - heading "Don't" [level=3] [ref=e444]
                        - list "Don't" [ref=e445]:
                          - listitem [ref=e446]: Don’t use error messages to display warnings. Error messages imply critical failure which needs immediate user attention and often requires rapid user action to continue with the flow. Warnings on the other hand are advisory.
