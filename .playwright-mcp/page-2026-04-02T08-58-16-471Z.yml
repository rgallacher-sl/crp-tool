              - paragraph [ref=e213]: "Error messages can be standalone field errors resulting from validation or be more complex requiring users take action on multiple elements across pages. In either case, provide error messages to users in the context of where the error occurred when possible, accounting for the scale and criticality of these errors. For example:"
              - list [ref=e214]:
                - listitem [ref=e215]:
                  - paragraph [ref=e216]: Show inline field error message for standalone field errors resulting from client side validation.
                - listitem [ref=e217]:
                  - paragraph [ref=e218]: Show a page level error alert above the submit button for an error resulting from server side validation.
                - listitem [ref=e219]:
                  - paragraph [ref=e220]: Show a page level flashbar for an error returned due to failure in deleting a resource.
                - listitem [ref=e221]:
                  - paragraph [ref=e222]: Show an error alert where a component failed to render.
