                - heading "Component specific functional errors" [level=3] [ref=e171]
              - paragraph [ref=e172]: "Errors that occur in a component due to fetching or loading issues. For example:"
              - list [ref=e173]:
                - listitem [ref=e174]:
                  - paragraph [ref=e175]:
                    - text: The
                    - link "autosuggest" [ref=e176]:
                      - /url: /components/autosuggest/
                    - text: has a built-in error state that is displayed when an error occurs while getting suggestions based on the user's entered query.
                - listitem [ref=e177]:
                  - paragraph [ref=e178]:
                    - text: The
                    - link "multiselect" [ref=e179]:
                      - /url: /components/multiselect/
                    - text: component error state occurs when it fails at fetching options (for example, if the API fails to load the next set of options in the list).
                - listitem [ref=e180]:
                  - paragraph [ref=e181]:
                    - text: The
                    - link "code editor" [ref=e182]:
                      - /url: /components/code-editor/
                    - text: error state is displayed when the component fails to load.
                - listitem [ref=e183]:
                  - paragraph [ref=e184]:
                    - text: The individual
                    - link "charts" [ref=e185]:
                      - /url: /components/bar-chart/?tabId=playground&example=error
                    - text: components have an error state that is displayed when they fail to fetch data.
              - generic [ref=e186]:
                - button "Copy link to Unexpected client-side errors section" [ref=e191] [cursor=pointer]:
                  - generic [ref=e192]:
