                - heading "Unexpected client-side errors" [level=3] [ref=e193]
              - paragraph [ref=e194]: Errors that occur due to a technical malfunction. For example, when a component fails to render. The cause of these errors is usually unknown, and there might not be a clear action to fix it. Instead, users can report the problem, and then reload the page or retry the operation again later.
