                - heading "Form or field validation" [level=3] [ref=e161]
              - paragraph [ref=e162]:
                - text: Client or server side errors that occur as a result of validation on a form, field, or flow. They usually require a user to perform an action on that field, form, or another page to remediate the error. Refer to the
                - link "validation" [ref=e163]:
