<div class="dropdown" [class.dropdown--error]="errorMessage">
  @if (label) {
    <label class="dropdown__label" [for]="'dropdown-' + label">{{ label }}</label>
  }
  @if (hint) {
    <span class="dropdown__hint">{{ hint }}</span>
  }
  <div class="dropdown__field-wrapper">
    <select
      class="dropdown__field"
      [id]="'dropdown-' + label"
      [disabled]="disabled"
      (change)="onSelect($event)"
    >
      <option value="" disabled [selected]="!value">{{ placeholder }}</option>
      @for (option of options; track option.value) {
        <option [value]="option.value" [selected]="option.value === value">{{ option.label }}</option>
      }
    </select>
    <span class="dropdown__chevron" aria-hidden="true">
      <app-icon name="chevron-down" [size]="16" />
    </span>
  </div>
  @if (errorMessage) {
    <span class="dropdown__error" role="alert">{{ errorMessage }}</span>
  }
</div>
