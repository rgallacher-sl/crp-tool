<nav aria-label="Breadcrumb">
  <ol class="breadcrumb">
    @for (item of items; track item.label; let last = $last) {
      <li class="breadcrumb__item" [class.breadcrumb__item--current]="last">
        @if (!last && item.href) {
          <a [routerLink]="item.href" class="breadcrumb__link">{{ item.label }}</a>
        } @else if (!last) {
          <span class="breadcrumb__link">{{ item.label }}</span>
        } @else {
          <span class="breadcrumb__current" aria-current="page">{{ item.label }}</span>
        }
        @if (!last) {
          <span class="breadcrumb__separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
