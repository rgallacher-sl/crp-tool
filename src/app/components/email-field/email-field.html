<div class="email-field" [class.email-field--error]="errorMessage">
  <label class="email-field__label" [for]="'email-' + label">{{ label }}</label>

  @if (errorMessage) {
    <div class="email-field__error" role="alert">
      <app-icon name="error" [size]="24" />
      <span>{{ errorMessage }}</span>
    </div>
  }

  <input
    class="email-field__input"
    type="email"
    [id]="'email-' + label"
    [value]="value"
    [autocomplete]="autocomplete"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
</div>
