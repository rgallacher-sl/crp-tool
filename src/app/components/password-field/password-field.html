<div class="password-field" [class.password-field--error]="errorMessage">
  <label class="password-field__label" [for]="'pwd-' + label">{{ label }}</label>

  @if (errorMessage) {
    <div class="password-field__error" role="alert">
      <app-icon name="error" [size]="24" />
      <span>{{ errorMessage }}</span>
    </div>
  }

  <div class="password-field__input-row">
    <input
      class="password-field__input"
      [id]="'pwd-' + label"
      [type]="showPassword ? 'text' : 'password'"
      [value]="value"
      [autocomplete]="autocomplete"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onTouched()"
    />
    <button
      type="button"
      class="password-field__toggle"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="showPassword"
      (click)="toggle()"
    >{{ showPassword ? 'Hide' : 'Show' }}</button>
  </div>

  @if (forgotPasswordHref) {
    <a [href]="forgotPasswordHref" class="password-field__forgot">I've forgotten my password</a>
  }
</div>
