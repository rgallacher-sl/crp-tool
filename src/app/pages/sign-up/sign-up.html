<div class="sign-in-page">
  <div class="sign-in-card">
    <h1>Create account</h1>
    <form (ngSubmit)="submit()" novalidate>
      @if (serverError) {
        <p class="server-error" role="alert">{{ serverError }}</p>
      }
<div class="field" [class.field--error]="emailError">
        <label for="email">Email address</label>
        @if (emailError) {
          <p class="field-error" id="email-error" role="alert">{{ emailError }}</p>
        }
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          [attr.aria-invalid]="emailError ? 'true' : null"
          [attr.aria-describedby]="emailError ? 'email-error' : null"
        />
      </div>

      <div class="field" [class.field--error]="passwordError">
        <label for="password">Password</label>
        @if (passwordError) {
          <p class="field-error" id="password-error" role="alert">{{ passwordError }}</p>
        }
        <p class="field-hint" id="password-hint">Must be at least 8 characters.</p>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            autocomplete="new-password"
            [attr.aria-invalid]="passwordError ? 'true' : null"
            [attr.aria-describedby]="passwordError ? 'password-hint password-error' : 'password-hint'"
          />
          <button type="button" class="show-hide-btn" (click)="showPassword = !showPassword">
            {{ showPassword ? 'Hide password' : 'Show password' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary full-width" [disabled]="submitting">
        {{ submitting ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="sign-in-link">Already have an account? <a routerLink="/sign-in">Sign in</a></p>
  </div>

  <label class="sim-toggle">
    <input type="checkbox" [(ngModel)]="simulateServerError" name="simulateServerError" />
    Simulate server error
  </label>
</div>
