<div class="sign-in-page">
  <div class="sign-in-card">
    <h1>Create account</h1>
    <form (ngSubmit)="submit()" novalidate>
      <div class="field" [class.field--error]="nameError">
        <label for="name">Full name</label>
        @if (nameError) {
          <p class="field-error" id="name-error" role="alert">{{ nameError }}</p>
        }
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          autocomplete="name"
          placeholder="Your name"
          [attr.aria-invalid]="nameError ? 'true' : null"
          [attr.aria-describedby]="nameError ? 'name-error' : null"
        />
      </div>

      <div class="field" [class.field--error]="emailError">
        <label for="email">Email address</label>
        @if (emailError) {
          <p class="field-error" id="email-error" role="alert">{{ emailError }}</p>
        }
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          [attr.aria-invalid]="emailError ? 'true' : null"
          [attr.aria-describedby]="emailError ? 'email-error' : null"
        />
      </div>

      <div class="field" [class.field--error]="passwordError">
        <label for="password">Password</label>
        @if (passwordError) {
          <p class="field-error" id="password-error" role="alert">{{ passwordError }}</p>
        }
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            autocomplete="new-password"
            [attr.aria-invalid]="passwordError ? 'true' : null"
            [attr.aria-describedby]="passwordError ? 'password-error' : null"
          />
          <button type="button" class="show-hide-btn" (click)="showPassword = !showPassword">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary full-width">Create account</button>
    </form>

    <p class="sign-in-link">Already have an account? <a routerLink="/sign-in">Sign in</a></p>
  </div>
</div>
